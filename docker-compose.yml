services:
  gostore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gostore-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - BASE_URL=http://localhost:8080
      - STORAGE_PATH=/app/data/storage
      - DATABASE_PATH=/app/data/gostore.db
      - MASTER_API_KEY=gostore-master-secret-key
      - MAX_UPLOAD_MB=500
    volumes:
      - ./data:/app/data

  prometheus:
    image: prom/prometheus:latest
    container_name: gostore-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'gostore'
          static_configs:
            - targets: ['gostore:8080']
