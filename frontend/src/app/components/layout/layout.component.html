<div class="app-layout" [class.mobile-sidebar-open]="goStore.mobileSidebarOpen()">
  <!-- Backdrop for mobile drawer -->
  @if (goStore.mobileSidebarOpen()) {
    <div class="sidebar-backdrop" (click)="goStore.closeMobileSidebar()"></div>
  }

  <!-- Modular Standalone Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Right Dashboard Area -->
  <div class="app-main-wrapper">
    <!-- Modular Standalone Navbar -->
    <app-navbar></app-navbar>

    <!-- Main View Container -->
    <main class="main-container">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
